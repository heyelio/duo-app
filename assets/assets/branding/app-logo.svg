<!-- About page identity mark - geometry only (`lib/app/pages/about_page.dart`).
     No plate and no colour of its own: the mark is opaque against a transparent
     field, so `BrandLogo` (`lib/app/theme/brand_logo.dart`) tints it with a `srcIn`
     filter and lays it on the rounded tile the page paints behind it. The white
     below is that stencil, never a colour that ships.
     Canvas 512 x 512; mark long edge = 428.4050px = 83.673% of the canvas, centered
     at (256, 256) - the bounding box inscribed in the canvas inscribed circle, so a
     rounded-square presentation cannot clip it. The page draws it at 96 dp inside a
     96 dp tile, so the 8.16% margin baked in here is the tile's own padding.
     One file for every theme because the colour never lived in the file: the tile
     ramp comes from `AppAccentGradient` (the active pack's seed) and the ink from
     the active scheme's `onPrimary`, so a pack swap or a band flip repaints it
     without touching this asset. -->
